spring.application.name=pawgeun

# 로컬 개발: compose.yaml의 PostgreSQL을 spring-boot-docker-compose가 자동으로 띄우고 연결한다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT. 기본값을 두지 않는다. 환경변수 JWT_SECRET(32바이트 이상 임의 문자열)이 없으면 서버가 시작되지 않는다.
# 로컬 개발: IntelliJ 실행 설정의 Environment variables에 JWT_SECRET=... 을 넣는다.
pawgeun.jwt.secret=${JWT_SECRET}
pawgeun.jwt.access-token-validity=30m
