spring.application.name=pawgeun

# 로컬 개발: compose.yaml의 PostgreSQL을 spring-boot-docker-compose가 자동으로 띄우고 연결한다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT. 운영에서는 반드시 환경변수 JWT_SECRET으로 32바이트 이상 임의 문자열을 주입한다.
# 아래 기본값은 로컬 개발 전용이며, 이 값으로 발급한 토큰은 누구나 위조할 수 있다.
pawgeun.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-in-production-0123456789}
pawgeun.jwt.access-token-validity=30m
